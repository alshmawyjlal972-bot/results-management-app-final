<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة النتائج</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container my-5">
    <h1 class="text-center mb-4">🎓 نظام إدارة النتائج</h1>

    <div id="errorBox" class="alert alert-danger d-none"></div>

    <div class="card p-4 shadow">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">اسم الطالب</label>
          <input type="text" id="studentName" class="form-control" placeholder="مثال: علي">
        </div>
        <div class="col-md-6">
          <label class="form-label">نسبة الحضور %</label>
          <input type="number" id="attendance" class="form-control" placeholder="0 - 100">
        </div>
        <div class="col-md-4">
          <label class="form-label">درجة المادة 1</label>
          <input type="number" id="grade1" class="form-control" placeholder="0 - 100">
        </div>
        <div class="col-md-4">
          <label class="form-label">درجة المادة 2</label>
          <input type="number" id="grade2" class="form-control" placeholder="0 - 100">
        </div>
        <div class="col-md-4">
          <label class="form-label">درجة المادة 3</label>
          <input type="number" id="grade3" class="form-control" placeholder="0 - 100">
        </div>
      </div>

      <div class="d-flex gap-2 mt-4">
        <button id="addBtn" class="btn btn-primary flex-fill">إضافة طالب</button>
        <button id="mercyBtn" class="btn btn-warning flex-fill">تفعيل لجنة الرأفة</button>
      </div>
    </div>

    <h3 class="mt-5">قائمة الطلاب</h3>
    <div id="studentsListDiv" class="card p-3">
      <p class="text-muted">لم يتم إضافة طلاب بعد...</p>
    </div>

    <h3 class="mt-4">التقرير النهائي للجنة الرأفة</h3>
    <div id="reportDiv" class="card p-3">
      <p class="text-muted">اضغط على زر لجنة الرأفة لعرض التقرير</p>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
